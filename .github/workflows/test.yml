name: windows-test

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Build release zip
        run: ./build.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: package
          path: dist/*.zip

  unit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Parse and compile
        shell: powershell
        run: .\tests\compile.ps1
      - name: State machine with real shutdown.exe
        shell: powershell
        run: .\tests\state.ps1
      - name: Abort any pending shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          cmd.exe /c "shutdown.exe /a >nul 2>&1"
          exit 0

  install:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: pkg
      - name: Extract release zip like Explorer
        shell: powershell
        run: .\tests\extract.ps1
      - name: Install, use and uninstall from the extracted folder
        shell: powershell
        run: .\tests\install.ps1
      - name: Abort any pending shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          cmd.exe /c "shutdown.exe /a >nul 2>&1"
          exit 0

  e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: End to end with real display off
        shell: powershell
        run: .\tests\e2e.ps1
      - name: Abort any pending shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          cmd.exe /c "shutdown.exe /a >nul 2>&1"
          exit 0
